<!DOCTYPE html>
<html lang="en">
<head>
  <title>Blockchain Certificate Verifier</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: "Raleway", sans-serif;
      height: 100%;
      background: url('https://images.pexels.com/photos/6432109/pexels-photo-6432109.jpeg') no-repeat center center/cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .navbar {
      background: rgba(0, 0, 0, 0.8);
      width: 100%;
      position: absolute;
      top: 0;
    }
    .navbar-brand img {
      filter: invert(100%);
    }
    .hero-box {
      background: rgba(255, 255, 255, 0.9);
      padding: 50px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
      margin-top: 60px;
    }
    .hero-box h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #007bff;
    }
    .form-control, .btn {
      margin-bottom: 15px;
      border-radius: 10px;
    }
    .alert {
      border-radius: 10px;
    }
    .footer-text {
      background: rgba(255, 255, 255, 0.9);
      color: #007bff;
      padding: 10px;
      border-radius: 10px;
      width: fit-content;
      margin: 20px auto 0 auto;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <img src="https://cdn-icons-png.flaticon.com/512/5675/5675014.png" alt="blockchain" width="30" height="30">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link text-white" href="{{url_for('welcome')}}">Home</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="{{url_for('login')}}">Login</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="hero-box">
  {% for message in get_flashed_messages() %}
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  {% endfor %}

  <h1>Blockchain Verifier</h1>
  <form method="POST" action="">
    <input type="text" class="form-control" name="username" placeholder="Username" required>
    <input type="password" class="form-control" name="password" placeholder="Password" required>
    <button type="submit" class="btn btn-primary w-100">Login</button>
  </form>

  <div class="footer-text">Powered by Blockchain</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
