<!DOCTYPE html>
<html lang="en">
<head>
  <title>Blockchain Certificate Verifier</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: "Raleway", sans-serif;
      height: 100%;
      background: url('https://www.aaup.edu/sites/default/files/node/822/jenin/cover-untitled2.jpg') no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .verifier-box {
      background: rgba(183, 221, 230, 0.8);
      padding: 50px;
      border-radius: 20px;
      width: 100%;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
    }
    .verifier-box h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: black;
    }
    .verifier-box a {
      font-size: 1.25rem;
      color: #007bff;
      text-decoration: none;
    }
    .verifier-box a:hover {
      text-decoration: underline;
    }
    .alert {
      border-radius: 10px;
    }
    .footer-text {
      background: rgba(255, 255, 255, 0.9);
      color: #007bff;
      padding: 10px;
      border-radius: 10px;
      width: fit-content;
      margin: 20px auto 0 auto;
    }
  </style>
</head>
<body>

<div class="verifier-box">
  {% for message in get_flashed_messages() %}
    <div class="alert alert-success">
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      {{ message }}
    </div>
  {% endfor %}

  <h1>Welcome to Blockchain Certificate Verifier</h1>
  <h3><a href="http://127.0.0.1:5000/certificate">Add Certificate</a></h3>
  <h3><a href="logout">Logout</a></h3>
  <div class="footer-text">Powered by Blockchain</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
