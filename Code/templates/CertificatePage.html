<!DOCTYPE html>
<html lang="en">
<head>
  <title>Blockchain Certificate Registration</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: "Raleway", sans-serif;
      height: 100%;
      background: url('https://images.pexels.com/photos/9829490/pexels-photo-9829490.jpeg') no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      color: rgb(18, 17, 17);
    }
    .form-box {
      background: rgba(255, 255, 255, 0.9);
      padding: 50px;
      border-radius: 20px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
    }
    .form-box h3 {
      text-align: center;
      margin-bottom: 30px;
      color: #007bff;
    }
    table {
      width: 100%;
    }
    td {
      padding: 10px;
    }
    .alert {
      border-radius: 10px;
    }
    input[type="submit"] {
      width: 100%;
      background-color: #007bff;
      color: rgb(20, 18, 18);
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
    }
    input[type="submit"]:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="form-box">
    <h3>CERTIFICATE REGISTRATION FORM</h3>
    {% for message in get_flashed_messages() %}
      <div class="alert alert-danger">
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        {{ message }}
      </div>
    {% endfor %}
    <form method="POST" action="http://127.0.0.1:5000/addcertificate" enctype="multipart/form-data">
      <table>
        <tr><td>Department:</td><td><input type="text" name="department" maxlength="30" required></td></tr>
        <tr><td>Name:</td><td><input type="text" name="studentname" maxlength="30" required></td></tr>
        <tr><td>Academic Year:</td><td><input type="text" name="academicyear" maxlength="30" required></td></tr>
        <tr><td>Reg No:</td><td><input type="text" name="regnum" maxlength="30" required></td></tr>
        <tr><td>Join Date:</td><td><input type="date" name="joiningdate" required></td></tr>
        <tr><td>End Date:</td><td><input type="date" name="enddate" required></td></tr>
        <tr><td>Marks:</td><td><input type="text" name="mark" maxlength="10" required></td></tr>
        <tr><td>Upload Certificate:</td><td><input type="file" name="certfile" class="form-control" required></td></tr>
        <tr><td>Personality:</td><td><input type="text" name="personality" maxlength="30" required></td></tr>
        <tr><td colspan="2"><input type="submit" value="Submit"></td></tr>
      </table>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
