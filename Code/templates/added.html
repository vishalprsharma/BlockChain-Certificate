<!DOCTYPE html>
<html lang="en">
<head>
  <title>Blockchain Certificate Added</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: "Raleway", sans-serif;
      height: 100%;
      background: url('https://rightcliqsolutions.com/wp-content/uploads/2021/02/How-To-Make-Document-Tamper-Proof-2-1.png') no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .success-box {
      background: rgba(255, 255, 255, 0.9);
      padding: 50px;
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
    }
    .success-box h3 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #007bff;
    }
    .success-box img {
      opacity: 0.9;
      width: 50%;
      height: auto;
    }
  </style>

<body>

<div class="success-box">
  <h3>Certificate added successfully to the Blockchain</h3>
  <img src="https://www.citypng.com/public/uploads/preview/-316225804095zek9ufozk.png" alt="Success Icon">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
